    --paper:#101820; --card:#18232C; --ink:#E6EDF2; --ink-2:#A6B8C4; --ink-3:#7C8F9B;
    --line:#2B3A45; --line-soft:#223039; --blue:#6FB4D6; --blue-soft:#1C3441;
    --hot:#F08B84; --hot-soft:#3A2220; --warm:#E0B45F; --warm-soft:#332915;
    --done:#7FCFA3; --done-soft:#173024; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#101820; --card:#18232C; --ink:#E6EDF2; --ink-2:#A6B8C4; --ink-3:#7C8F9B;
  --line:#2B3A45; --line-soft:#223039; --blue:#6FB4D6; --blue-soft:#1C3441;
  --hot:#F08B84; --hot-soft:#3A2220; --warm:#E0B45F; --warm-soft:#332915;
  --done:#7FCFA3; --done-soft:#173024; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Golos Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%; font-variant-numeric:tabular-nums;
}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px 64px}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.hot{color:var(--hot)} .warm{color:var(--warm)} .far{color:var(--ink-3)} .ok{color:var(--done)}

/* вкладки */
.tabs{display:flex;gap:4px;margin:12px 0 12px;background:var(--line-soft);padding:3px;border-radius:10px}
.tabs button{flex:1;font:inherit;font-size:13.5px;font-weight:500;padding:7px 8px;border:none;border-radius:8px;
  background:transparent;color:var(--ink-2);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

/* линейка семестра */
.ruler{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:12px 12px 8px;margin-bottom:12px;box-shadow:var(--shadow)}
.ruler-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.now{font-weight:700;font-size:16px}
.now span{color:var(--ink-3);font-weight:500;font-size:13px}
.bars{display:flex;gap:3px;align-items:flex-end;height:38px}
.wk{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:3px}
.wk i{display:block;height:5px;border-radius:2px;background:var(--line);opacity:.55}
.wk .bar{height:12px;border-radius:3px;background:var(--line-soft);border:1px solid var(--line)}
.wk.cur .bar{background:var(--blue);border-color:var(--blue);height:20px}
.wk i.d-hot{background:var(--hot);opacity:1}
.wk i.d-warm{background:var(--warm);opacity:1}
.wk i.d-done{background:var(--done);opacity:1}
.wk i.d-far{background:var(--ink-3);opacity:.6}
.wknums{display:flex;gap:3px;margin-top:5px}
.wknums div{flex:1;text-align:center;font-size:10px;color:var(--ink-3)}
.wknums div.cur{color:var(--blue);font-weight:700}

.subjects{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;width:100%;text-align:left;
  font:inherit;color:inherit;background:none;border:none;border-top:1px solid var(--line-soft);padding:11px 12px;cursor:pointer}
.srow:first-child{border-top:none}
.srow .sname{font-size:15px;font-weight:600}
.srow .smeta{font-size:12px;color:var(--ink-3);margin-top:2px}
.srow.off .sname,.srow.off .smeta{color:var(--ink-3);font-weight:500}
.dots{display:flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:transparent;border:1.5px solid var(--line);display:block}
.dots i.u-hot{border-color:var(--hot)} .dots i.u-warm{border-color:var(--warm)} .dots i.u-far{border-color:var(--ink-3)}
.dots i.s-none{border-style:dashed}
.dots i.s-todo.u-hot{background:var(--hot)} .dots i.s-todo.u-warm{background:var(--warm)} .dots i.s-todo.u-far{background:var(--ink-3)}
.dots i.s-ready{border-color:var(--done)}
.dots i.s-done{border-color:var(--done);background:var(--done)}
.chev{color:var(--ink-3);font-size:18px;line-height:1}
.badge{display:inline-block;font-size:11px;font-weight:600;color:var(--ink-3);border:1px solid var(--line);
  border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px}

.back{font:inherit;font-size:13px;color:var(--blue);background:none;border:none;padding:0 0 10px;cursor:pointer}
.subj{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}

.scount{font-size:12px;color:var(--ink-3);white-space:nowrap}
.smeta{font-size:12px;color:var(--ink-3);margin-top:3px}
.ssend{font-size:12px;color:var(--ink-2);margin-top:5px;border-left:2px solid var(--blue);padding-left:8px}

/* строка работы */
.lab{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:9px 12px;border-top:1px solid var(--line-soft)}
.lab:first-of-type{border-top:none}
.st{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--line);background:transparent;cursor:pointer;
  padding:0;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-3);flex:0 0 auto}
.st.u-hot{border-color:var(--hot);color:var(--hot)}
.st.u-warm{border-color:var(--warm);color:var(--warm)}
.st.u-far{border-color:var(--ink-3);color:var(--ink-3)}
.st.todo{border-style:solid;border-width:2px}
.st.todo.u-hot{background:var(--hot-soft)}
.st.todo.u-warm{background:var(--warm-soft)}
.st.ready{border-style:solid;border-width:2px;border-color:var(--done);color:var(--done);background:transparent}
.st.done{border-style:solid;border-color:var(--done);background:var(--done);color:#fff}
.st.rework{border-style:solid;border-width:2px;border-color:var(--hot);background:var(--hot-soft);color:var(--hot)}
.mini{font:inherit;font-size:11px;padding:1px 6px;margin-top:3px;border:1px solid var(--line);border-radius:7px;
  background:transparent;color:var(--ink-3);cursor:pointer}
.pick{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0 4px;

.pick button.warnbtn{border-color:var(--hot);color:var(--hot)}
.lmain{text-align:left;background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;min-width:0}
.lname{font-size:14.5px;font-weight:500}
.lname .pre{color:var(--ink-3);font-weight:600}
.lab.done .lname{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line)}
.lmeta{font-size:12px;color:var(--ink-3);margin-top:1px}
.ldl{text-align:right;font-size:12px;line-height:1.25;white-space:nowrap}
.ldl b{display:block;font-size:13px;font-weight:600}
.det{grid-column:1/-1;padding:2px 0 8px;border-top:1px dashed var(--line-soft);margin-top:4px}

.det li{margin:2px 0}
.fields{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.fields label{font-size:12px;color:var(--ink-3)}
input[type="date"],input[type="text"]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);

input[type="text"]{flex:1;min-width:140px}
.addrow{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line-soft)}
.btn{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
.btn.pri{border-color:var(--blue);color:var(--blue)}

.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ldl{cursor:pointer}
body.w .wrap{max-width:420px;padding:10px}
body.w .head,body.w .tabs,body.w .foot{display:none}

.wopen{display:block;margin-top:9px;font-size:12px;color:var(--blue);text-align:center;cursor:pointer}
.foot{margin-top:18px;font-size:12px;color:var(--ink-3);text-align:center}
.foot b{font-weight:600;color:var(--ink-2)}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.st{transition:background .12s ease,border-color .12s ease}}

const DAY = 86400000, TOTAL_WEEKS = 17;
const today = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); })();
const MONTHS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const MONTHS_FULL = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const DOW = ["вс","пн","вт","ср","чт","пт","сб"];

const weekOf = d => Math.floor((d - W1) / (7 * DAY)) + 1;
const parse = s => { if (!s) return null; const [y,m,dd] = s.split("-").map(Number); return new Date(y, m-1, dd); };

const daysLeft = d => Math.round((d - today) / DAY);

function leftText(n) {
  if (n < 0) return `просрочено на ${Math.abs(n)} дн.`;
  if (n === 0) return "сегодня";
  if (n === 1) return "завтра";
  const t = n % 10, h = n % 100;

  return `${n} ${w}`;
}
function urgency(d, status, repeat) {
  if (status === "done") return "ok";
  if (!d) return "far";

/* ===== Состояние ===== */
const LS = "lr-tracker-v1";
let state = { status:{}, date:{}, note:{}, extra:{}, last:{}, count:{} };
let dbDoc = null, saveTimer = null;
let tab = "subjects", prevTab = "subjects", openSubject = null, filter = "all";
let widgetMode = false;
try { widgetMode = localStorage.getItem("lr-widget") === "1" || location.hash === "#w"; } catch(e){ widgetMode = location.hash === "#w"; }
function setWidget(on){
  widgetMode = on; openSubject = null; picker = null;
  if (typeof syncDepth === "function") syncDepth();
  try { localStorage.setItem("lr-widget", on ? "1" : "0"); } catch(e){}
  document.body.classList.toggle("w", on);
  window.scrollTo(0,0); paint();
}
let zoom = 1;
try { zoom = parseFloat(localStorage.getItem("lr-zoom")) || 1; } catch(e){}
function applyZoom(){ document.documentElement.style.zoom = String(zoom); }
const openIds = new Set();

const STATES = ["none","todo","ready","done","rework"];
const MARK = { none:"", todo:"", ready:"✓", done:"✓", rework:"↩" };
const LABEL = { none:"не выдано", todo:"не готова", ready:"готова", done:"сдана", rework:"на доработке" };
let picker = null;   // { id, mode: "states" | "rework" | "call" }
const labList = s => (s.labs || []).concat(state.extra[s.id] || []);
const statusOf = l => state.status[l.id] || l.status || "none";
const dateOf = l => {
  const d = parse(state.date[l.id] || l.plan || "");
  if (!d || !l.repeat) return d;
  let t = d.getTime();                      // повторяющееся — показываем ближайшую дату
  while (t < today.getTime()) t += l.repeat * DAY;
  return new Date(t);
};
const urg = l => urgency(dateOf(l), statusOf(l), l.repeat);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));

function loadLocal(){ try{ const r = localStorage.getItem(LS); if (r) state = Object.assign(state, JSON.parse(r)); }catch(e){} migrate(); }
function migrate(){ // раньше "done" означало «готова»
  if (!state.count) state.count = {};
  if (state.v === 2) return;
  Object.keys(state.status || {}).forEach(k => { if (state.status[k] === "done") state.status[k] = "ready"; });
  state.v = 2;
}
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
let dirty = false, lsOK = true;
try { localStorage.setItem("lr-test","1"); localStorage.removeItem("lr-test"); } catch(e){ lsOK = false; }
function netNote(){
  const el = document.getElementById("net");
  if (!el) return;
  if (!lsOK){ el.textContent = "Браузер не даёт этой копии сохранять отметки — они пропадут после закрытия страницы."; el.style.color = "var(--hot)"; return; }
  if (!navigator.onLine) el.textContent = "Сети нет — отметки сохраняются на телефоне и уедут в облако, когда связь вернётся.";
  else el.textContent = (dirty && dbDoc) ? "Синхронизирую…" : "";
}
function push(){
  if (!dbDoc){ dirty = true; netNote(); return; }
  dbDoc.set({ ...state, updatedAt:new Date().toISOString() })
    .then(() => { dirty = false; netNote(); })
    .catch(() => { dirty = true; netNote(); });
}
function save(){
  saveLocal(); dirty = true; netNote();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(push, 400);
}
window.addEventListener("online", () => { netNote(); if (dirty) push(); });
window.addEventListener("offline", netNote);

/* ===== Куски разметки ===== */
function rulerHTML(){
  const byWeek = {};
  DATA.forEach(s => labList(s).forEach(l => {
    const d = dateOf(l); if (!d) return;
    const w = weekOf(d); if (w < 1 || w > TOTAL_WEEKS) return;
    const u = urg(l);
    (byWeek[w] = byWeek[w] || []).push(u === "ok" ? "done" : u);
  }));
  let bars = "", nums = "";
  for (let w = 1; w <= TOTAL_WEEKS; w++){
    const marks = (byWeek[w] || []).slice(0,3).map(u => `<i class="d-${u}"></i>`).join("");
    bars += `<div class="wk ${w === CUR_WEEK ? "cur" : ""}" title="${w} неделя">${marks}<span class="bar"></span></div>`;
    nums += `<div class="${w === CUR_WEEK ? "cur" : ""}">${w % 2 === 1 || w === CUR_WEEK ? w : ""}</div>`;
  }
  let done = 0, ready = 0, total = 0;
  DATA.forEach(s => labList(s).forEach(l => { total++; const st = statusOf(l); if (st === "done") done++; else if (st === "ready") ready++; }));
  return `<section class="ruler">
    <div class="ruler-top">
      <div class="now">${CUR_WEEK}-я неделя <span>· ${CUR_WEEK % 2 ? "нечётная" : "чётная"} · ${fmtFull(today)}</span></div>
      <div class="sub">сдано ${done} из ${total}${ready ? ` · готово ${ready}` : ""}</div>
    </div>
    <div class="bars">${bars}</div><div class="wknums">${nums}</div></section>`;
}

function labRowHTML(s, l, showSubject){
  const st = statusOf(l), d = dateOf(l), u = urg(l);
  const hard = l.hard ? parse(l.hard) : null;
  const uu = st === "done" ? "ok" : (st === "rework" ? "hot" : u);
  const stCls = st + " u-" + uu;
  const meta = [ l.repeat ? `каждые ${l.repeat / 7} недели${state.count[l.id] ? `, уже ${state.count[l.id]}` : ""}` : "", d ? `${weekOf(d)} неделя` : "", hard ? `крайний ${fmt(hard)}` : "",
                 (l.sure === false && d && !hard) ? "дату поставил я" : "" ].filter(Boolean).join(" · ");
  return `<div class="lab ${st}">
    <button class="st ${stCls}" data-open="${l.id}" aria-label="подробности, статус: ${LABEL[st]}" title="подробности"></button>
    <button class="lmain" data-cycle="${l.id}">
      <div class="lname">${showSubject ? `<span class="pre">${esc(s.short)} · </span>` : ""}${esc(l.n)}${l.title && !l.title.startsWith("—") ? " · " + esc(l.title) : ""}${(l.sure === false && st !== "none" && !l.hard) ? '<span class="q">?</span>' : ""}</div>
      <div class="lmeta">${meta || "срок не объявлен"}</div>
    </button>
    <div class="ldl" data-cycle="${l.id}" role="button">${d ? `<b class="${uu}">${fmt(d)}</b>` : `<b class="far">срок ?</b>`}${
      st === "done" ? `<button class="mini" data-rework="${l.id}">развернули</button>`
                    : `<span class="${uu}">${d ? leftText(daysLeft(d)) : "уточнить"}</span>`}</div>
    ${picker && picker.id === l.id ? pickerHTML(l) : ""}
    <div class="det" ${openIds.has(l.id) ? "" : "hidden"}>
      ${l.repeat && (state.last || {})[l.id] ? `<p>Последний отмечен: ${fmt(parse(state.last[l.id]))}.</p>` : ""}
      ${l.why ? `<p>Откуда срок: ${esc(l.why)}</p>` : ""}
      ${(l.det || []).length ? `<ul>${l.det.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      <div class="fields">
        <label>Свой срок <input type="date" data-date="${l.id}" value="${state.date[l.id] || l.plan || ""}"></label>
        <input type="text" placeholder="заметка" data-note="${l.id}" value="${esc(state.note[l.id] || "")}">
        ${l.custom ? `<button class="btn ghost" data-del="${l.id}" data-subj="${s.id}">удалить</button>` : ""}
      </div>
    </div></div>`;
}
function pickerHTML(l){
  const st = statusOf(l);
  if (picker.mode === "call") return `<div class="pick"><span class="q2">Созвонились?</span>
    <button data-call="${l.id}" class="on">да, отметить</button><button data-cancel="1">отмена</button></div>`;
  if (picker.mode === "rework") return `<div class="pick"><span class="q2">Развернули на доработку?</span>
    <button data-set="rework" class="warnbtn">да, вернули</button><button data-cancel="1">отмена</button></div>`;
  return `<div class="pick"><span class="q2">Какой статус ставим?</span>
    ${STATES.map(x => `<button data-set="${x}" class="${x === st ? "on" : ""}${x === "rework" ? " warnbtn" : ""}">${LABEL[x]}</button>`).join("")}
    <button data-cancel="1">отмена</button></div>`;
}
function setMark(){
  document.querySelectorAll("button.st").forEach(b => {
    const l = findLab(b.dataset.open);
    if (l.repeat){ b.textContent = "↻"; return; }
    const st = state.status[b.dataset.open] || (l.status || "none");
    b.textContent = MARK[st] || "";
  });
}

/* ===== Экраны ===== */
function viewSubjects(){
  const rows = DATA.map(s => {
    const all = labList(s);
    const badge = s.badge ? ` <span class="badge">${esc(s.badge)}</span>` : "";
    if (!all.length) return `<button class="srow off" data-subj="${s.id}">
        <div><div class="sname">${esc(s.name)}${badge}</div>
        <div class="smeta">${esc(s.teacher)}</div></div><div class="dots"></div><div class="chev">›</div></button>`;
    const done = all.filter(l => statusOf(l) === "done").length;
    const ready = all.filter(l => statusOf(l) === "ready").length;
    const nearest = all.filter(l => statusOf(l) !== "done" && dateOf(l)).sort((a,b) => dateOf(a) - dateOf(b))[0];
    const nd = nearest ? dateOf(nearest) : null;
    const u = nearest ? urg(nearest) : "far";
    const dots = all.map(l => {
      const st = statusOf(l);
      return `<i class="s-${st} u-${urg(l)}"></i>`;
    }).join("");
    const bits = [ `сдано ${done} из ${all.length}`, ready ? `готово ${ready}` : "",
                   nd ? `ближайшее ${fmt(nd)}` : "" ].filter(Boolean).join(" · ");
    return `<button class="srow" data-subj="${s.id}">
      <div><div class="sname">${esc(s.name)}${badge}</div><div class="smeta ${nd && u === "hot" ? "hot" : ""}">${esc(s.teacher)} · ${bits}</div></div>
      <div class="dots">${dots}</div><div class="chev">›</div></button>`;
  }).join("");
  return rulerHTML() + `<div class="subjects">${rows}</div>`;
}

function viewSubject(id){
  const s = DATA.find(x => x.id === id);
  if (!s) return viewSubjects();
  const all = labList(s);
  const done = all.filter(l => statusOf(l) === "done").length;
  const cnt = all.length ? `сдано ${done} из ${all.length}` : (s.badge || "нет работ");
  const body = !all.length
    ? `<div class="lab"><div></div><div class="lmeta">Сдавать ничего не нужно.</div><div></div></div>`
    : all.map(l => labRowHTML(s, l, false)).join("") +
      `<div class="addrow"><input type="text" data-new="${s.id}" placeholder="добавить работу — например «ЛР2 · очередь задач»"><button class="btn pri" data-add="${s.id}">+</button></div>`;
  return `<button class="back" data-back="1">← Все предметы</button>
    <section class="subj">
      <div class="shead">
        <div class="t"><div class="sname">${esc(s.name)}${s.badge ? ` <span class="badge">${esc(s.badge)}</span>` : ""}</div><div class="scount">${cnt}</div></div>
        <div class="smeta">${esc(s.teacher)}${s.meta ? " · " + esc(s.meta) : ""}</div>
        ${s.send ? `<div class="ssend">${esc(s.send)}</div>` : ""}
        ${s.note ? `<div class="ssend">${esc(s.note)}</div>` : ""}
      </div>${body}</section>`;
}

function passes(l){
  const st = statusOf(l), d = dateOf(l);
  if (filter === "all") return true;
  if (filter === "hot") return urg(l) === "hot";
  return filter === st;
}

function viewDeadlines(){
  const items = [];
  DATA.forEach(s => labList(s).forEach(l => { if (passes(l)) items.push({ s, l, d: dateOf(l) }); }));
  const dated = items.filter(i => i.d).sort((a,b) => a.d - b.d);
  const undated = items.filter(i => !i.d);
  let html = `<div class="chips" id="chips">
    ${[["all","Всё"],["hot","Горит"],["none","Не выдано"],["todo","Не готова"],["ready","Готова"],["done","Сдана"],["rework","Доработка"]]
      .map(([f,t]) => `<button class="chip" data-f="${f}" aria-pressed="${filter === f}">${t}</button>`).join("")}
  </div>`;
  if (!dated.length && !undated.length) return html + `<div class="empty">Ничего не подходит под фильтр.</div>`;
  let month = null, open = false;
  dated.forEach(i => {
    const m = i.d.getFullYear() + "-" + i.d.getMonth();
    if (m !== month){
      if (open) html += "</section>";
      month = m; open = true;
      html += `<div class="mhead">${MONTHS_FULL[i.d.getMonth()]}</div><section class="subj">`;
    }
    html += labRowHTML(i.s, i.l, true);
  });
  if (open) html += "</section>";
  if (undated.length){
    html += `<div class="mhead">без срока</div><section class="subj">` + undated.map(i => labRowHTML(i.s, i.l, true)).join("") + `</section>`;
  }
  return rulerHTML() + html;
}

function findLab(id){ for (const s of DATA){ const l = labList(s).find(x => x.id === id); if (l) return l; } return {}; }
function findSubjOf(id){ return DATA.find(s => labList(s).some(l => l.id === id)); }

function widgetHTML(){
  const items = [];
  DATA.forEach(s => labList(s).forEach(l => {
    const st = statusOf(l); if (st === "done") return;
    const d = dateOf(l); if (d) items.push({ s, l, d });
  }));
  items.sort((a,b) => a.d - b.d);
  return `<div class="wcard">
    <div class="whead"><span>Ближайшее</span><span>${CUR_WEEK} неделя</span></div>
    ${items.slice(0,3).map(i => { const u = urg(i.l); return `<div class="wrow">
      <b class="${u}">${fmt(i.d)}</b><span>${esc(i.s.short)} · ${esc(i.l.n)}</span>
      <i class="${u}">${leftText(daysLeft(i.d))}</i></div>`; }).join("")}
    <a class="wopen" data-full="1">весь трекер →</a></div>`;
}

const dstamp = x => `${x.getFullYear()}${String(x.getMonth()+1).padStart(2,"0")}${String(x.getDate()).padStart(2,"0")}`;
const icsEsc = t => String(t).replace(/[\\;,]/g, m => "\\" + m).replace(/\s*\n\s*/g, " ");
function calItems(){
  const out = [];
  DATA.forEach(s => labList(s).forEach(l => {
    const st = statusOf(l), d = dateOf(l);
    if (!d || st === "done") return;
    out.push({ s, l, d, title: `${s.short} · ${l.n}${l.title && !l.title.startsWith("—") ? " " + l.title : ""}` });
  }));
  return out.sort((a,b) => a.d - b.d);
}
function icsText(){
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//LR tracker//RU","CALSCALE:GREGORIAN","X-WR-CALNAME:Дедлайны ЛР"];
  calItems().forEach(i => {
    L.push("BEGIN:VEVENT", `UID:lr-${i.l.id}@tracker.local`, `DTSTAMP:${dstamp(today)}T090000Z`,
      `DTSTART;VALUE=DATE:${dstamp(i.d)}`, `DTEND;VALUE=DATE:${dstamp(new Date(i.d.getTime() + DAY))}`,
      "SUMMARY:" + icsEsc(i.title),
      "DESCRIPTION:" + icsEsc(i.l.why || ""),
      "BEGIN:VALARM","TRIGGER:-PT15H","ACTION:DISPLAY","DESCRIPTION:" + icsEsc(i.title),"END:VALARM","END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n") + "\r\n";
}
function downloadICS(){
  try{
    const url = URL.createObjectURL(new Blob([icsText()], { type:"text/calendar;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = "deadlines.ics";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }catch(e){ alert("Не получилось скачать отсюда — открой страницу в отдельной вкладке браузера."); }
}
function gcalURL(i){
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(i.title)
    + "&dates=" + dstamp(i.d) + "/" + dstamp(new Date(i.d.getTime() + DAY))
    + "&details=" + encodeURIComponent(i.l.why || "");
}
function viewCal(){
  const items = calItems();
  return `<button class="back" data-backcal="1">← назад</button>
  <section class="subj">
    <div class="shead">
      <div class="t"><div class="sname">Календарь телефона</div><div class="scount">${items.length} дат</div></div>
      <div class="smeta">Виджет 2×2 на рабочем столе умеет только календарь — значит, даты должны лежать в нём.</div>
      <div class="ssend">Внутри приложения Claude скачивание файлов заблокировано, поэтому основной способ — «+ в календарь» у каждой строки: откроется Google Календарь с заполненными полями, останется нажать «Сохранить». Кнопки со скачиванием сработают, только если открыть эту страницу в браузере.</div>
    </div>
    <div class="addrow"><button class="btn pri" data-ics="1">Скачать все даты файлом .ics</button></div>
    ${items.map(i => `<div class="lab">
      <div class="ldl" style="text-align:left"><b class="${urg(i.l)}">${fmt(i.d)}</b></div>
      <div class="lmain"><div class="lname">${esc(i.title)}</div></div>
      <a class="mini" href="${gcalURL(i)}" target="_blank" rel="noopener">+ в календарь</a>
    </div>`).join("")}
    <div class="addrow" style="display:block;color:var(--ink-3);font-size:12px">
      Чтобы вынести трекер на главный экран: войди в Chrome на claude.ai под своим аккаунтом, открой там этот трекер и выбери «Добавить на главный экран». Войти нужно один раз, дальше ярлык открывается сразу.
    </div>
  </section>`;
}

function paint(){
  if (widgetMode){ document.getElementById("app").innerHTML = widgetHTML(); return; }
  document.getElementById("app").innerHTML =
    openSubject ? viewSubject(openSubject)
    : tab === "subjects" ? viewSubjects()
    : tab === "cal" ? viewCal()
    : viewDeadlines();
  [...document.getElementById("tabs").children].forEach(b => b.setAttribute("aria-pressed", String(!openSubject && b.dataset.tab === tab)));
  const cb = document.getElementById("calbtn"); if (cb) cb.classList.toggle("on", tab === "cal" && !openSubject);
  setMark();
}

/* ===== События ===== */
/* ===== Системная кнопка/жест «назад» =====
   В истории держим максимум ОДНУ свою запись: пока открыт уровень (предмет,
   календарь или выбор статуса) — она есть, на корневом экране её нет.
   Поэтому лишние записи не копятся, сколько бы ты ни прыгал по вкладкам. */
let hDepth = 0, selfPop = false;
const isDeep = () => !!(openSubject || picker || tab === "cal");
function syncDepth(){
  const want = isDeep() ? 1 : 0;
  if (want === 1 && hDepth === 0){ try { history.pushState({ lr:1 }, ""); hDepth = 1; } catch(e){} }
  else if (want === 0 && hDepth === 1){
    hDepth = 0; selfPop = true;
    setTimeout(() => { selfPop = false; }, 500);   // страховка, если popstate не придёт
    try { history.back(); } catch(e){ selfPop = false; }
  }
}
window.addEventListener("popstate", () => {
  if (selfPop){ selfPop = false; return; }      // это мы сами свернули уровень
  hDepth = 0;
  if (picker) picker = null;
  else if (openSubject) openSubject = null;
  else if (tab === "cal") tab = prevTab;
  else return;                                   // корень — страница закрывается
  window.scrollTo(0,0); syncDepth(); paint();
});

document.addEventListener("click", e => {
  const t = e.target.closest("[data-backcal],[data-ics],[data-zoom],[data-w],[data-full],[data-tab],[data-subj],[data-back],[data-cycle],[data-open],[data-add],[data-del],[data-f],[data-set],[data-cancel],[data-call],[data-rework]");
  if (!t) return;
  const d = t.dataset;
  if (d.zoom){
    zoom = Math.min(1.6, Math.max(0.8, Math.round((zoom + 0.1 * Number(d.zoom)) * 10) / 10));
    try { localStorage.setItem("lr-zoom", zoom); } catch(e){}
    applyZoom(); return;
  }
  if (d.ics){ downloadICS(); return; }
  if (d.w){ setWidget(true); return; }
  if (d.full){ setWidget(false); return; }
  if (d.tab){
    if (d.tab === tab && !openSubject) return;
    if (d.tab === "cal" && tab !== "cal" && !openSubject) prevTab = tab;
    tab = d.tab; openSubject = null; picker = null; window.scrollTo(0,0); syncDepth(); paint(); return;
  }
  if (d.backcal){ tab = prevTab; picker = null; window.scrollTo(0,0); syncDepth(); paint(); return; }
  if (d.back){ openSubject = null; picker = null; window.scrollTo(0,0); syncDepth(); paint(); return; }
  if (d.subj && !d.del){ openSubject = d.subj; picker = null; window.scrollTo(0,0); syncDepth(); paint(); return; }
  if (d.f){ filter = d.f; picker = null; syncDepth(); paint(); return; }
  if (d.cycle){                                      // тап по строке открывает выбор статуса
    const lab = findLab(d.cycle);
    picker = (picker && picker.id === d.cycle) ? null : { id:d.cycle, mode: lab.repeat ? "call" : "states" };
    syncDepth(); paint(); return;
  }
  if (d.rework){ picker = { id:d.rework, mode:"rework" }; syncDepth(); paint(); return; }
  if (d.cancel){ picker = null; syncDepth(); paint(); return; }
  if (d.set){
    state.status[picker.id] = d.set;
    picker = null; save(); syncDepth(); paint(); return;
  }
  if (d.call){
    const lab = findLab(d.call);
    state.last = state.last || {}; state.last[d.call] = iso(today);
    state.count[d.call] = (state.count[d.call] || 0) + 1;
    state.date[d.call] = iso(new Date(today.getTime() + lab.repeat * DAY));
    picker = null; save(); syncDepth(); paint(); return;
  }
  if (d.open){ openIds.has(d.open) ? openIds.delete(d.open) : openIds.add(d.open); paint(); return; }
  if (d.add){
    const field = document.querySelector(`[data-new="${d.add}"]`);
    const name = field && field.value.trim();
    if (!name){ if (field) field.focus(); return; }
    const id = d.add + "_x" + Date.now();
    (state.extra[d.add] = state.extra[d.add] || []).push({ id, n:name, title:"", plan:"", sure:false, status:"todo", custom:true, why:"добавлено вручную" });
    save(); paint(); return;
  }
  if (d.del){
    const sid = d.subj, id = d.del;
    state.extra[sid] = (state.extra[sid] || []).filter(x => x.id !== id);
    delete state.status[id]; delete state.date[id]; delete state.note[id]; delete state.count[id];
    save(); paint(); return;
  }
});
document.addEventListener("change", e => { if (e.target.dataset.date){ state.date[e.target.dataset.date] = e.target.value; save(); paint(); } });
document.addEventListener("input", e => { if (e.target.dataset.note){ state.note[e.target.dataset.note] = e.target.value; save(); } });

/* ===== Старт ===== */
loadLocal();
applyZoom();
document.body.classList.toggle("w", widgetMode);
setTimeout(netNote, 0);
paint();
const footText = local => "Тап по строке — выбор статуса, тап по кружку — подробности. У сданной работы рядом есть «развернули», если препод вернул на доработку." +
  (local ? " Сохраняется в этом браузере." : " Статусы сохраняются и подтягиваются на любом устройстве.") +
  ` <button class="btn" data-w="1" style="margin-top:8px">режим виджета</button>`;
document.getElementById("foot").innerHTML = footText(true);

(async () => {
  try{
    if (!window.claude || typeof window.claude.use !== "function") return;
    const db = await window.claude.use("db");
    if (!db) return;
    dbDoc = db.doc("state/tracker");
    const snap = await dbDoc.get();
    if (snap.exists){
      const v = snap.data() || {};
      const remote = Object.assign({}, v.status || {});
      if (v.v !== 2) Object.keys(remote).forEach(k => { if (remote[k] === "done") remote[k] = "ready"; });
      state = { status:Object.assign({}, state.status, remote), date:Object.assign({}, state.date, v.date||{}),
                note:Object.assign({}, state.note, v.note||{}), extra:Object.assign({}, state.extra, v.extra||{}),
                last:Object.assign({}, state.last, v.last||{}), count:Object.assign({}, state.count, v.count||{}), v:2 };
      saveLocal(); paint();
    } else if (Object.keys(state.status).length) save();
    document.getElementById("foot").innerHTML = footText(false);
  }catch(e){}
})();

/* ===== офлайн-режим на хостинге (GitHub Pages) ===== */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
